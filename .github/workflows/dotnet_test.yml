name: dotnet_test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
  # FileParty packages the compat consumer takes from nuget.org (they ship from the FileParty repo).
  # FileParty.Core 2.1.0 must be on nuget.org before this repo can restore at all.
  FILEPARTY_VERSION: 2.1.0

jobs:
  # net10.0 tests, then pack with package validation against the live nuget.org releases.
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Test (net10.0)
      run: dotnet test test/FileParty.Providers.Azure.Storage.Tests --configuration Release --verbosity normal
    # GeneratePackageOnBuild=false: combining it with `dotnet pack` races and drops the net10.0 dll (NU5026).
    - name: Pack + validate against 2.0.0 (nuget.org)
      run: dotnet pack src/FileParty.Providers.Azure.Storage -c Release -p:GeneratePackageOnBuild=false -o artifacts/packages
    - name: Validate against 1.3.1 (nuget.org)
      run: |
        # Package validation is incremental and does not re-run when only the baseline changes.
        rm -f src/*/obj/Release/*ValidatePackage.semaphore
        dotnet pack src/FileParty.Providers.Azure.Storage -c Release -p:GeneratePackageOnBuild=false -p:PackageValidationBaselineVersion=1.3.1 -o artifacts/validate-1.3.1
    - uses: actions/upload-artifact@v4
      with:
        name: packages
        path: artifacts/packages/*.nupkg

  # net48 consumes the netstandard2.0 build, so this runs the tests against that asset.
  # Runs after `build` because both use the same storage container and blob names.
  netfx:
    runs-on: windows-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Test (net48 -> netstandard2.0)
      shell: bash
      run: dotnet test test/FileParty.Providers.Azure.Storage.Tests --configuration Release -f net48 --verbosity normal

  # A net48 + net6.0 consumer that already pins older Azure / AWS / Microsoft.Extensions versions must restore
  # and build against the new packages without NU1605/NU1608 or forced upgrades.
  compat:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        profile: [ low, high ]
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - uses: actions/download-artifact@v4
      with:
        name: packages
        path: artifacts/packages
    - name: Fetch FileParty ${{ env.FILEPARTY_VERSION }} packages from nuget.org
      run: |
        for id in FileParty.Core FileParty.Providers.FileSystem FileParty.Providers.AWS.S3; do
          lower=$(echo "$id" | tr '[:upper:]' '[:lower:]')
          curl -fsSL -o "artifacts/packages/$id.$FILEPARTY_VERSION.nupkg" \
            "https://api.nuget.org/v3-flatcontainer/$lower/$FILEPARTY_VERSION/$lower.$FILEPARTY_VERSION.nupkg" \
            || { echo "::error::$id $FILEPARTY_VERSION is not on nuget.org yet; publish FileParty first."; exit 1; }
        done
    - name: Restore + build compat consumer (${{ matrix.profile }})
      run: dotnet build samples/compat -p:CompatProfile=${{ matrix.profile }} -p:FilePartyVersion=$FILEPARTY_VERSION
